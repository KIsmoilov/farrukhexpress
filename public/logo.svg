<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Farrukh Express Inc">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe08a"/>
      <stop offset=".28" stop-color="#c9962b"/>
      <stop offset=".5" stop-color="#7d5713"/>
      <stop offset=".72" stop-color="#d9a83a"/>
      <stop offset="1" stop-color="#f7d472"/>
    </linearGradient>
    <linearGradient id="type" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde9a4"/>
      <stop offset=".48" stop-color="#e0b344"/>
      <stop offset=".52" stop-color="#a97b1c"/>
      <stop offset="1" stop-color="#f4cf6b"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdeaa8"/>
      <stop offset=".45" stop-color="#d3a234"/>
      <stop offset=".55" stop-color="#8a6318"/>
      <stop offset="1" stop-color="#eec358"/>
    </linearGradient>
  </defs>

  <!-- outer gold ring -->
  <circle cx="100" cy="100" r="98" fill="url(#ring)"/>
  <circle cx="100" cy="100" r="87" fill="#0a0a0a"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#ring)" stroke-width="3.5"/>

  <!-- truck front: hood, grille slats, headlights, stacks -->
  <g fill="url(#chrome)">
    <rect x="79" y="27" width="42" height="7" rx="2.5"/>
    <rect x="74" y="37" width="52" height="4.6" rx="2"/>
    <rect x="74" y="44" width="52" height="4.6" rx="2"/>
    <rect x="74" y="51" width="52" height="4.6" rx="2"/>
    <rect x="74" y="58" width="52" height="4.6" rx="2"/>
    <rect x="66" y="40" width="5" height="22" rx="2.5"/>
    <rect x="129" y="40" width="5" height="22" rx="2.5"/>
    <rect x="70" y="66" width="60" height="5" rx="2.5"/>
  </g>

  <!-- FE monogram -->
  <text x="100" y="120" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-weight="700" font-size="52" fill="url(#type)" letter-spacing="-1">FE</text>

  <!-- wordmark -->
  <text x="100" y="145" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-weight="900" font-size="19" letter-spacing="0.5" fill="url(#type)">FARRUKH</text>
  <text x="100" y="162" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-weight="900" font-size="15" letter-spacing="1.2" fill="url(#type)">EXPRESS</text>
  <text x="100" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="700" font-size="9" letter-spacing="4.5" fill="#e6b23c">INC</text>
</svg>
